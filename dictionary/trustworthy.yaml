# Trustworthy AI terms, in alphabetical order.
domain: Trustworthy AI
terms:
- key: accountability
  term: Accountability
  definitions:
  - source: hleg-2019
    text: >-
      A requirement for trustworthy AI: mechanisms are in place to ensure responsibility
      and accountability for AI systems and their outcomes, before and after development,
      deployment, and use. These include auditability, minimising and reporting
      negative impacts, trade-offs, and redress.
  - source: nist-ai-rmf
    at: §3.4
    text: >-
      Accountability presupposes transparency. It concerns who answers for an
      AI system's outcomes, and it depends on organisational practices and governing
      structures for reducing harms, such as risk management and clear roles and
      responsibilities.
  - source: bovens-2007
    text: >-
      In public governance, a relationship between an actor and a forum in which
      the actor must explain and justify its conduct, the forum can pose questions
      and pass judgement, and the actor may face consequences.
  note: >-
    Bovens's relational definition clarifies that accountability needs an identifiable
    party who must answer, and someone they must answer to. Transparency alone
    does not provide either.
  related:
  - transparency
  - auditability
  - ai-governance
- key: accuracy
  term: Accuracy
  definitions:
  - source: iso-5723
    quote: true
    text: >-
      The closeness of results of observations, computations, or estimates to
      the true values or the values accepted as being true.
  - source: goodfellow-2016
    at: §5.1.2
    text: >-
      For classification, the proportion of examples for which the model produces
      the correct output. Its complement is the error rate.
  - source: eu-ai-act
    at: Art. 15
    text: >-
      High-risk AI systems must achieve an appropriate level of accuracy, and
      the levels of accuracy and the relevant accuracy metrics must be declared
      in their instructions for use.
  note: >-
    The NIST AI RMF (§3.1) adopts the ISO/IEC TS 5723 definition and adds that
    measures of accuracy should consider computational-centric measures, such
    as false positive and false negative rates, human-AI teaming, and external
    validity, meaning results generalise beyond the training conditions. Accuracy
    measurements should always be paired with clearly defined and realistic test
    sets, representative of the conditions of expected use, and with details about
    the test methodology. The ML metric called accuracy is only one such measure,
    and can mislead when classes are imbalanced.
  related:
  - validity
  - reliability
  - robustness
  - test-data
- key: adversarial-example
  term: Adversarial Example
  definitions:
  - source: szegedy-2014
    text: >-
      An input formed by applying a small, often imperceptible, perturbation to
      a correctly classified example, chosen so that a neural network misclassifies
      it.
  - source: goodfellow-2015
    text: >-
      Inputs formed by intentionally adding worst-case perturbations. The authors
      argue that vulnerability to them comes mainly from the models' largely linear
      behaviour in high-dimensional spaces, not from non-linearity or overfitting.
  - source: nist-ai-100-2
    text: >-
      The product of an *evasion attack*: at deployment time, an adversary modifies
      a test sample to change the model's prediction to one the attacker chooses.
  related:
  - robustness
  - data-poisoning
  - security
  - resilience
- key: ai-governance
  term: AI Governance
  definitions:
  - source: mantymaki-2022
    text: >-
      A system of rules, practices, processes, and technological tools used to
      ensure that an organisation's use of AI technologies is aligned with its
      strategies, objectives, and values, fulfils legal requirements, and meets
      principles of ethical AI.
  - source: iso-42001
    text: >-
      Realised through an *AI management system*: the interrelated policies, objectives,
      and processes an organisation establishes for the responsible development,
      provision, or use of AI systems.
  - source: nist-ai-rmf
    at: §5.1
    text: >-
      The GOVERN function: a culture of risk management is cultivated and present
      across the organisation. It cuts across and informs the MAP, MEASURE, and
      MANAGE functions.
  related:
  - accountability
  - ai-risk
  - auditability
- key: alignment
  term: Alignment
  alias: AI alignment
  definitions:
  - source: ji-2023-alignment
    text: >-
      The goal of making AI systems behave in line with human intentions and values.
      It is characterised by the RICE objectives: robustness, interpretability,
      controllability, and ethicality.
  - source: gabriel-2020
    text: >-
      The normative and technical problem of making AI act in accordance with
      appropriate values. The problem includes choosing whether a system should
      follow instructions, intentions, revealed preferences, ideal preferences,
      interests, or values.
  - source: russell-2019
    text: >-
      Ensuring that machines pursue objectives that are beneficial to humans.
      The proposed route is for machines to be uncertain about human preferences
      and to learn them from behaviour, rather than to optimise a fixed, possibly
      misspecified objective.
  related:
  - rlhf
  - safety
  - human-oversight
- key: auditability
  term: Auditability
  alias: algorithmic audit
  definitions:
  - source: hleg-2019
    text: >-
      The ability to assess an AI system's algorithms, data, and design processes,
      by internal or external auditors, with the resulting reports available.
      It is especially important for systems affecting fundamental rights.
  - source: raji-2020
    text: >-
      Supported by an internal audit process, SMACTR (scoping, mapping, artifact
      collection, testing, and reflection), that produces documentation throughout
      development. The documentation lets an organisation check a system against
      its declared ethical expectations before deployment.
  - source: iso-42001
    text: >-
      Achieved through internal audits of the AI management system at planned
      intervals, which check conformity with the organisation's requirements and
      the standard.
  related:
  - accountability
  - transparency
  - model-card
- key: bias
  term: Bias
  alias: AI bias
  definitions:
  - source: nist-sp-1270
    text: >-
      Bias in AI falls into three categories. *Systemic* biases come from institutional
      practices. *Statistical and computational* biases come from unrepresentative
      data or modelling choices. *Human-cognitive* biases shape how people design,
      interpret, and use AI systems.
  - source: friedman-nissenbaum-1996
    text: >-
      Computer systems that *systematically and unfairly discriminate* against
      certain individuals or groups in favour of others. Bias may be pre-existing,
      technical, or emergent.
  - source: mehrabi-2021
    text: >-
      Systematic errors or skews at any stage of the ML pipeline, such as data
      collection, sampling, measurement, algorithm design, or user interaction,
      that can lead to unfair outcomes.
  - source: hastie-2009
    text: >-
      In statistics, the difference between an estimator's expected value and
      the true value. This is a technical property with no moral meaning, and
      is often traded off against variance.
  note: >-
    The statistical meaning is neutral and often intentional, as in regularisation.
    The socio-technical meanings are about unjust outcomes. Say which meaning
    is intended.
  related:
  - fairness
  - training-data
  - validation-data
  - test-data
- key: data-poisoning
  term: Data Poisoning
  definitions:
  - source: nist-ai-100-2
    text: >-
      An attack at training time in which an adversary controls part of the training
      data, or the labels, to degrade model performance in general (availability
      poisoning) or to cause targeted or backdoor behaviour (integrity poisoning).
  - source: biggio-2012
    text: >-
      Injecting specially crafted training points to raise a learning algorithm's
      test error. The paper demonstrates this against support vector machines
      by computing the points with gradient ascent.
  - source: owasp-llm-2025
    text: >-
      For large language models: manipulation of pre-training, fine-tuning, or
      embedding data to introduce vulnerabilities, backdoors, or biases that compromise
      security, performance, or ethical behaviour.
  related:
  - adversarial-example
  - security
  - resilience
  - training-data
  - validation-data
  - test-data
- key: datasheet
  term: Datasheet for Datasets
  alias: datasheet
  definitions:
  - source: gebru-2021
    text: >-
      A document accompanying a dataset that records its motivation, composition,
      collection process, preprocessing and labelling, uses, distribution, and
      maintenance, so that dataset creators reflect on their choices and dataset
      consumers can decide whether it suits their task.
  - source: bender-friedman-2018
    text: >-
      Called a *data statement* in natural language processing: documentation
      of a dataset’s speakers, annotators, language varieties, and curation rationale,
      so that readers can judge whose language a model trained on it represents.
  - source: eu-ai-act
    at: Art. 10
    text: >-
      Related regulatory concept: data governance for high-risk AI systems must
      cover data collection processes, data origin, preparation operations, assumptions,
      and the examination of possible biases.
  related:
  - model-card
  - bias
  - training-data
  - transparency
- key: differential-privacy
  term: Differential Privacy
  alias: DP
  definitions:
  - source: dwork-roth-2014
    text: >-
      A mathematical guarantee that the output of an analysis is almost equally
      likely whether or not any single individual's data are included. A mechanism
      $M$ is $(\varepsilon,\delta)$-differentially private if, for all neighbouring
      datasets $D, D'$ and all sets of outputs $S$, $\Pr[M(D)\in S] \le e^{\varepsilon}\Pr[M(D')\in
      S] + \delta$.
  - source: nist-ai-rmf
    at: §3.6
    text: >-
      One of several privacy-enhancing technologies that can support privacy-enhanced
      AI. It may trade off against accuracy, and therefore against fairness for
      small groups.
  related:
  - privacy
- key: explainability
  term: Explainability
  alias: XAI
  definitions:
  - source: nist-ai-rmf
    at: §3.5
    text: >-
      A representation of the mechanisms underlying an AI system's operation.
      It answers the question of *how* a decision was made.
  - source: nist-ir-8312
    text: >-
      Characterised by four principles. A system gives evidence or reasons for
      its outputs (*explanation*). The explanations are understandable to their
      audience (*meaningful*). They correctly reflect the process that produced
      the output (*explanation accuracy*). The system operates only within its
      designed conditions and confidence (*knowledge limits*).
  - source: barredo-2020
    text: >-
      Given an audience, an explainable AI is one that produces details or reasons
      to make its functioning clear or easy to understand.
  - source: hleg-2019
    text: >-
      Part of transparency: the ability to explain both the technical processes
      of an AI system and the related human decisions, adapted to the expertise
      of the stakeholder concerned.
  note: >-
    Every definition makes explainability depend on its *audience*. NIST separates
    it from interpretability, but many papers use the two words interchangeably.
  related:
  - interpretability
  - transparency
- key: fairness
  term: Fairness
  alias: algorithmic fairness
  definitions:
  - source: nist-ai-rmf
    at: §3.7
    quote: true
    text: >-
      Fairness in AI includes concerns for equality and equity by addressing issues
      such as harmful bias and discrimination.
  - source: dwork-2012
    text: >-
      *Individual fairness*: similar individuals should be treated similarly,
      formalised as a Lipschitz condition on the classifier under a task-specific
      similarity metric.
  - source: hardt-2016
    text: >-
      *Equalised odds*: a predictor is fair if its predictions are independent
      of a protected attribute conditional on the true outcome. That is, true-
      and false-positive rates are equal across groups. *Equal opportunity* relaxes
      this to equal true-positive rates.
  - source: hleg-2019
    text: >-
      A requirement named *diversity, non-discrimination and fairness*. It covers
      avoiding unfair bias, accessibility and universal design, and involving
      stakeholders throughout the lifecycle.
  note: >-
    NIST adds that standards of fairness can be complex and difficult to define,
    because perceptions of fairness differ among cultures and may shift depending
    on application, and that systems in which harmful biases are mitigated are
    not necessarily fair (see the useful note on fairness in the absence of harmful
    bias). Group criteria, such as demographic parity and equalised odds, and
    individual criteria cannot in general all be satisfied at once. Choosing among
    them is a normative decision that should be documented.
  related:
  - bias
  - accountability
- key: human-oversight
  term: Human Oversight
  definitions:
  - source: eu-ai-act
    at: Art. 14
    text: >-
      High-risk AI systems must be designed and developed so that natural persons
      can effectively oversee them while they are in use. The aim is to prevent
      or minimise risks to health, safety, or fundamental rights, including by
      being able to understand, monitor, override, or stop the system.
  - source: hleg-2019
    text: >-
      Part of the requirement *human agency and oversight*. It may be achieved
      through human-in-the-loop, human-on-the-loop, or human-in-command approaches,
      which differ in how closely a human is involved.
  - source: nist-ai-rmf
    text: >-
      Human roles and responsibilities in decision-making and in overseeing AI
      systems should be clearly defined and differentiated, taking account of
      human cognitive biases such as automation bias.
  note: >-
    Oversight is only effective if the overseer has the competence, authority,
    time, and information to intervene. Without these, a human reviewer may end
    up bearing responsibility for outcomes they could not actually control.
  related:
  - human-in-the-loop
  - autonomy
  - accountability
- key: human-in-the-loop
  term: Human-in-the-Loop
  alias: HITL
  definitions:
  - source: hleg-2019
    text: >-
      The capability for human intervention in every decision cycle of the system.
      It contrasts with *human-on-the-loop*, where humans intervene during design
      and monitor operation, and *human-in-command*, where humans oversee overall
      activity and decide when and how to use the system.
  - source: mosqueira-rey-2023
    text: >-
      In machine learning, approaches in which humans take part in the learning
      process, for example through active learning, interactive ML, or machine
      teaching, so as to improve model accuracy or efficiency.
  note: >-
    The governance meaning concerns human control over decisions. The ML meaning
    concerns humans contributing to training.
  related:
  - human-oversight
  - rlhf
- key: interpretability
  term: Interpretability
  definitions:
  - source: doshi-velez-2017
    quote: true
    text: >-
      The ability to explain or to present in understandable terms to a human.
  - source: miller-2019
    text: >-
      The degree to which a human can understand the cause of a decision. Miller
      uses it interchangeably with *explainability*.
  - source: nist-ai-rmf
    at: §3.5
    text: >-
      The meaning of an AI system's output in the context of its designed functional
      purpose. It answers the question of *why* a decision was made and what it
      means to the user.
  related:
  - explainability
  - transparency
- key: model-card
  term: Model Card
  definitions:
  - source: mitchell-2019
    text: >-
      A short document accompanying a trained model that gives benchmarked evaluation
      across relevant conditions, such as demographic groups, as well as intended
      use, out-of-scope uses, evaluation procedures, and ethical considerations.
  - source: nist-ai-rmf
    text: >-
      Documentation of an AI system’s intended purposes, limitations, and known
      risks is part of the MAP and GOVERN functions and supports transparency
      and accountability.
  - source: eu-ai-act
    at: Art. 11
    text: >-
      Related regulatory concept: the *technical documentation* that providers
      of high-risk AI systems must draw up before placing them on the market and
      keep up to date.
  related:
  - datasheet
  - transparency
  - auditability
- key: privacy
  term: Privacy
  alias: privacy-enhanced AI
  definitions:
  - source: nist-ai-rmf
    at: §3.6
    quote: true
    text: >-
      Privacy refers generally to the norms and practices that help to safeguard
      human autonomy, identity, and dignity. These norms and practices typically
      address freedom from intrusion, limiting observation, or individuals’ agency
      to consent to disclosure or control of facets of their identities (e.g.,
      body, data, reputation).
  - source: hleg-2019
    text: >-
      The requirement *privacy and data governance*: respect for privacy, the
      quality and integrity of data, and legitimate access to data, throughout
      the system's lifecycle.
  - source: nist-ai-100-2
    text: >-
      The target of *privacy attacks*, such as membership inference, data reconstruction,
      and model extraction, which aim to recover information about training data
      or the model.
  related:
  - differential-privacy
  - security
  - resilience
- key: prompt-injection
  term: Prompt Injection
  definitions:
  - source: nist-ai-100-2
    text: >-
      An attack in which an adversary inserts instructions into a generative AI
      system's input. In *direct* prompt injection the attacker is the user. In
      *indirect* prompt injection the instructions arrive through external content,
      such as a web page or document, that the system consumes.
  - source: greshake-2023
    text: >-
      Indirect prompt injection: planting prompts in data likely to be retrieved
      by an LLM-integrated application, which blurs the line between data and
      instructions and allows the attacker to control the application remotely.
  - source: owasp-llm-2025
    text: >-
      A vulnerability, ranked first among risks to LLM applications, in which
      user prompts or external content alter the model's behaviour or output in
      unintended ways. Outcomes include data disclosure and unauthorised actions.
  note: >-
    Prompt injection is distinct from *jailbreaking*, which targets the model's
    safety training. Prompt injection targets the application built around the
    model.
  related:
  - prompt
  - agentic-ai
  - retrieval-augmented-generation
  - security
  - resilience
- key: red-teaming
  term: Red Teaming
  definitions:
  - source: ganguli-2022
    text: >-
      Adversarially probing a language model, by human or automated means, to
      discover and measure harmful outputs, so that the harms can be analysed
      and reduced.
  - source: nist-ai-600-1
    text: >-
      A structured testing effort, often by teams outside the development group,
      to find flaws and vulnerabilities in a generative AI system, such as harmful
      or discriminatory outputs, unforeseen behaviour, or potential misuse.
  - source: eu-ai-act
    at: Art. 55
    text: >-
      Adversarial testing that providers of general-purpose AI models with systemic
      risk must carry out and document, in order to identify and mitigate systemic
      risks.
  related:
  - ai-risk
  - safety
  - security
  - resilience
- key: reliability
  term: Reliability
  definitions:
  - source: iso-5723
    quote: true
    text: >-
      The ability of an item to perform as required, without failure, for a given
      time interval, under given conditions.
  - source: iso-22989
    text: The property of consistent intended behaviour and results.
  - source: hleg-2019
    text: >-
      Part of technical robustness: a reliable system works properly with a range
      of inputs and in a range of situations. *Reproducibility*, obtaining the
      same behaviour when an experiment is repeated under the same conditions,
      is a related requirement.
  related:
  - validity
  - robustness
  - distribution-shift
  - uncertainty-quantification
  - accuracy
  note: >-
    The NIST AI RMF (§3.1) adopts the ISO/IEC TS 5723 definition. ISO/IEC TS 5723
    defines trustworthiness for systems and their associated services, along with
    a selected set of their characteristics.
- key: resilience
  term: Resilience
  definitions:
  - source: nist-ai-rmf
    at: §3.3
    quote: true
    text: >-
      AI systems, as well as the ecosystems in which they are deployed, may be
      said to be resilient if they can withstand unexpected adverse events or
      unexpected changes in their environment or use – or if they can maintain
      their functions and structure in the face of internal and external change
      and degrade safely and gracefully when this is necessary.
  - source: eu-ai-act
    at: Art. 15
    text: >-
      High-risk AI systems shall be as resilient as possible regarding errors,
      faults, or inconsistencies that may occur within the system or its environment,
      for example through technical redundancy, including backup or fail-safe
      plans.
  - source: hleg-2019
    text: >-
      Part of technical robustness and safety: AI systems are resilient to attacks
      and have fall-back plans that allow them to continue operating safely, or
      to ask for a human operator, when problems arise.
  related:
  - security
  - robustness
  - safety
  note: NIST adapts its definition from ISO/IEC TS 5723:2022.
- key: ai-risk
  term: Risk
  definitions:
  - source: cisa-2021
    quote: true
    text: >-
      Potential for an unwanted outcome resulting from an incident, event, or
      occurrence, as determined by its likelihood and associated consequences.
  - source: eu-ai-act
    at: Art. 3(2)
    quote: true
    text: >-
      The combination of the probability of an occurrence of harm and the severity
      of that harm.
  - source: nist-ai-rmf
    at: §1.1
    text: >-
      A composite measure of an event's probability of occurring and the magnitude
      or degree of the consequences. AI risks can affect individuals, groups,
      organisations, communities, society, the environment, and the planet.
  - source: iso-31000
    text: >-
      The effect of uncertainty on objectives, where an effect is a deviation
      from the expected and can be positive, negative, or both.
  note: >-
    ISO 31000 counts positive deviations (opportunities) as risk. The EU AI Act
    and NIST AI RMF concentrate on harm. The EU AI Act classifies systems into
    risk tiers (prohibited, high-risk, limited, and minimal), and each tier carries
    different obligations. CISA’s definition frames risk around incidents; its
    example is a team calculating the risk of a terrorist attack after analysing
    intelligence reports, vulnerability assessments, and consequence models.
  related:
  - ai-governance
  - safety
  - red-teaming
  - risk-framework
  - risk-methodology
  alias: AI risk
- key: risk-framework
  term: Risk Framework
  definitions:
  - source: twai-internal
    quote: true
    text: >-
      A risk framework is a way of categorizing risk and identifying risk cases.
      The AI Security Tree is an example of a risk framework.
  - source: iso-guide-73
    at: §2.1.1
    text: >-
      A *risk management framework* is the set of components that provide the
      foundations and organisational arrangements for designing, implementing,
      monitoring, reviewing, and continually improving risk management throughout
      an organisation.
  - source: nist-ai-rmf
    at: §5
    text: >-
      The AI RMF is itself a risk management framework, organised into four functions:
      GOVERN, MAP, MEASURE, and MANAGE.
  note: >-
    The TwAI sense is a taxonomy of risks. The ISO sense is the organisational
    arrangements for managing risk. The NIST AI RMF combines both, with categories
    of risk and trustworthiness characteristics inside an organisational process.
  related:
  - risk-methodology
  - ai-risk
  - ai-governance
- key: risk-methodology
  term: Risk Methodology
  definitions:
  - source: twai-internal
    quote: true
    text: >-
      A risk methodology, e.g., SIE, is a formal process for identifying, characterizing,
      and quantifying risk in a system.
  - source: iso-guide-73
    at: §3.4.1
    text: >-
      The closest standard concept is *risk assessment*: the overall process of
      risk identification, risk analysis, and risk evaluation.
  related:
  - risk-framework
  - ai-risk
  - system-of-systems
- key: robustness
  term: Robustness
  definitions:
  - source: iso-22989
    text: >-
      The ability of a system to maintain its level of performance under any circumstances,
      including external interference and harsh environmental conditions.
  - source: iso-5723
    quote: true
    text: >-
      The ability of a system to maintain its level of performance under a variety
      of circumstances.
  - source: nist-ai-rmf
    at: §3.1
    quote: true
    text: >-
      Robustness is a goal for appropriate system functionality in a broad set
      of conditions and circumstances, including uses of AI systems not initially
      anticipated. Robustness requires not only that the system perform exactly
      as it does under expected uses, but also that it should perform in ways
      that minimize potential harms to people if it is operating in an unexpected
      setting.
  - source: hleg-2019
    text: >-
      Named *technical robustness and safety*: AI systems are resilient to attack,
      have fall-back plans, and are accurate, reliable, and reproducible, so that
      unintentional harm is minimised.
  - source: eu-ai-act
    at: Art. 15
    text: >-
      High-risk AI systems shall be as resilient as possible to errors, faults,
      or inconsistencies within the system or its environment, for example through
      technical redundancy and fail-safe plans.
  - source: madry-2018
    text: >-
      *Adversarial robustness*: low worst-case loss under any perturbation within
      an allowed set, formalised as a min–max (saddle-point) optimisation problem.
  related:
  - adversarial-example
  - validity
  - reliability
  - distribution-shift
  - uncertainty-quantification
  - accuracy
  note: >-
    ISO/IEC 22989 asks for maintained performance under *any* circumstances, ISO/IEC
    TS 5723 under *a variety* of them. NIST extends the idea to unanticipated
    uses, where the goal becomes minimising harm rather than matching expected
    performance.
- key: safety
  term: Safety
  alias: AI safety
  definitions:
  - source: nist-ai-rmf
    at: §3.2
    text: >-
      AI systems should not, under defined conditions, lead to a state in which
      human life, health, property, or the environment is endangered.
  - source: amodei-2016
    text: >-
      The problem of *accidents* in ML systems: unintended and harmful behaviour
      arising from poor design. Examples are negative side effects, reward hacking,
      unsafe exploration, and brittleness under distributional shift.
  - source: hleg-2019
    text: >-
      Part of technical robustness: AI systems are developed with a preventive
      approach to risk, behave reliably as intended, and minimise unintentional
      and unexpected harm.
  note: >-
    “AI safety” also names a research field concerned with risks from advanced
    AI, including misalignment. In product and engineering contexts it usually
    means freedom from unacceptable risk of physical or psychological harm.
  related:
  - alignment
  - ai-risk
  - robustness
- key: security
  term: Security
  definitions:
  - source: nist-ai-rmf
    at: §3.3
    text: >-
      An AI system is secure if it maintains confidentiality, integrity, and availability
      through protection mechanisms that prevent unauthorised access and use.
  - source: eu-ai-act
    at: Art. 15
    text: >-
      Cybersecurity: high-risk AI systems shall be resilient against attempts
      by unauthorised third parties to alter their use, outputs, or performance
      by exploiting vulnerabilities. AI-specific examples include data poisoning,
      model poisoning, adversarial examples, and confidentiality attacks.
  - source: nist-ai-100-2
    text: >-
      In adversarial machine learning, attacks are classified by the attacker’s
      goals (availability, integrity, privacy, and misuse), their capabilities
      and knowledge, and the stage of the ML lifecycle they target.
  note: >-
    NIST separates security (protection against attack) from resilience (recovery
    from adverse events of any cause). The EU AI Act groups cybersecurity with
    accuracy and robustness in Article 15.
  related:
  - resilience
  - adversarial-example
  - data-poisoning
  - prompt-injection
- key: system-of-systems
  term: System of Systems
  alias: SoS
  definitions:
  - source: twai-internal
    quote: true
    text: >-
      When an AI system is introduced into another system, you now have a SoS,
      which may introduce AI + System Risk Factors.
  - source: dod-sos-2008
    text: >-
      A set or arrangement of systems that results when independent and useful
      systems are integrated into a larger system that delivers unique capabilities.
  - source: maier-1998
    text: >-
      An assemblage of components that are themselves systems, distinguished by
      the operational independence and the managerial independence of those components.
  note: >-
    TwAI currently uses *system of systems*, *internal system dynamics*, and *AI
    + System Risk Factors* somewhat interchangeably. They could be distinguished:
    the system of systems is the combined system, internal system dynamics are
    the interactions among its component systems, and AI + System Risk Factors
    are the risks that arise from those interactions.
  related:
  - ai-system
  - ai-risk
  - risk-framework
- key: transparency
  term: Transparency
  definitions:
  - source: nist-ai-rmf
    at: §3.4
    quote: true
    text: >-
      Transparency reflects the extent to which information about an AI system
      and its outputs is available to individuals interacting with such a system
      – regardless of whether they are even aware that they are doing so.
  - source: hleg-2019
    text: >-
      A requirement covering *traceability* of data and processes, *explainability*,
      and *communication*. People are told when they are interacting with an AI
      system, and they are told its capabilities and limitations.
  - source: eu-ai-act
    at: Art. 13
    text: >-
      High-risk AI systems shall be designed so that their operation is sufficiently
      transparent to enable deployers to interpret the system's output and use
      it appropriately. The systems are accompanied by instructions for use.
  - source: eu-ai-act
    at: Art. 50
    text: >-
      Transparency obligations toward the people affected: for example, disclosing
      that they are interacting with an AI system, and marking synthetic or deep-fake
      content.
  related:
  - explainability
  - accountability
  - model-card
  note: >-
    NIST adds that meaningful transparency provides access to appropriate levels
    of information, based on the stage of the AI lifecycle and tailored to the
    role or knowledge of the AI actors or individuals using the system, and that
    by promoting higher levels of understanding, transparency increases confidence
    in the AI system. See the useful note on how transparency, explainability,
    and interpretability relate.
- key: trustworthy-ai
  term: Trustworthy AI
  definitions:
  - source: hleg-2019
    text: >-
      AI that is *lawful*, *ethical*, and *robust*. It is realised through seven
      requirements: human agency and oversight; technical robustness and safety;
      privacy and data governance; transparency; diversity, non-discrimination
      and fairness; societal and environmental well-being; and accountability.
  - source: nist-ai-rmf
    at: §3
    text: >-
      AI that has these characteristics: valid and reliable; safe; secure and
      resilient; accountable and transparent; explainable and interpretable; privacy-enhanced;
      and fair with harmful bias managed. Validity and reliability are the base
      for the others, and the characteristics must be balanced against each other
      in context.
  - source: iso-24028
    text: >-
      Rests on *trustworthiness*: the ability to meet stakeholders' expectations
      in a verifiable way. For AI this covers characteristics such as reliability,
      availability, resilience, security, privacy, safety, accountability, transparency,
      integrity, authenticity, quality, and usability.
  - source: oecd-2024
    text: >-
      AI that respects the OECD values-based principles: inclusive growth, sustainable
      development and well-being; human rights and democratic values, including
      fairness and privacy; transparency and explainability; robustness, security
      and safety; and accountability.
  note: >-
    The frameworks overlap heavily but are organised differently. The EU HLEG
    starts from ethics and fundamental rights, NIST from risk management, and
    ISO/IEC from verifiable stakeholder expectations.
  related:
  - accountability
  - explainability
  - fairness
  - privacy
  - robustness
  - safety
  - transparency
  - validity
  - reliability
- key: validation
  term: Validation
  definitions:
  - source: iso-9000
    quote: true
    text: >-
      Confirmation, through the provision of objective evidence, that the requirements
      for a specific intended use or application have been fulfilled.
  - source: nist-ai-rmf
    at: §3.1
    text: >-
      Adopts the ISO 9000 definition. Deploying AI systems that are inaccurate,
      unreliable, or poorly generalised to data and settings beyond their training
      creates and increases negative AI risks and reduces trustworthiness.
  - source: roy-oberkampf-2011
    text: >-
      In scientific computing, the process of determining the degree to which
      a model is an accurate representation of the real world from the perspective
      of its intended uses, usually by comparing predictions with experimental
      data. It is distinguished from *verification*, which checks that the model
      is solved correctly.
  - source: hastie-2009
    at: §7.2
    text: >-
      In machine learning, estimating a model’s prediction error on data held
      out from training, in order to choose among candidate models.
  note: >-
    The quality-management and scientific-computing senses ask whether a system
    is fit for its intended use. The machine learning sense is narrower: a held-out
    evaluation used during model selection, done with validation data. ISO 9000:2015
    sets out the fundamental concepts and principles of quality management.
  related:
  - validity
  - validation-data
  - accuracy
  - reliability
- key: validity
  term: Validity
  definitions:
  - source: nist-ai-rmf
    at: §3.1
    text: >-
      *Validation* is confirmation, through objective evidence, that the requirements
      for a specific intended use or application have been fulfilled. NIST treats
      validity and reliability together as the foundation of trustworthiness.
  - source: jacobs-wallach-2021
    text: >-
      In measurement, the extent to which a measurement model actually captures
      the unobservable construct it is meant to measure, such as “creditworthiness”
      or “risk”. It includes construct validity and content validity.
  note: >-
    NIST’s definition concerns whether a system meets requirements for its intended
    use. The measurement definition concerns whether the quantities a system predicts
    or is evaluated on mean what they claim to mean.
  related:
  - validation
  - reliability
  - validation-data
  - trustworthy-ai
  - uncertainty-quantification
  - accuracy
