# Machine Learning terms, in alphabetical order.
domain: Machine Learning
terms:
- key: concept-drift
  term: Concept Drift
  definitions:
  - source: gama-2014
    text: >-
      A change over time in the relationship between input data and the target
      variable, which makes a model learned on past data less accurate.
  - source: widmer-kubat-1996
    text: >-
      A change in the target concept being learned, often caused by hidden context
      that the features do not capture, which requires the learner to detect the
      change and adapt.
  - source: moreno-torres-2012
    text: >-
      Termed *concept shift*: a change in the conditional distribution of outputs
      given inputs, while the input distribution may stay the same.
  related:
  - distribution-shift
  - reliability
- key: deep-learning
  term: Deep Learning
  alias: DL
  definitions:
  - source: lecun-2015
    text: >-
      Representation-learning methods with multiple levels of representation,
      obtained by composing simple non-linear modules that each transform the
      representation at one level into a more abstract representation at the next.
  - source: goodfellow-2016
    at: ch. 1
    text: >-
      An approach to AI in which computers learn from experience and understand
      the world as a hierarchy of concepts, each defined in relation to simpler
      ones. The depth of that hierarchy gives the field its name.
  - source: iso-22989
    text: >-
      An approach to creating rich hierarchical representations by training neural
      networks with many hidden layers.
  related:
  - neural-network
  - machine-learning
  - transformer
- key: distribution-shift
  term: Distribution Shift
  alias: dataset shift
  definitions:
  - source: quinonero-2009
    text: >-
      The situation in which the joint distribution of inputs and outputs differs
      between the training and test (or deployment) stages. Special cases include
      covariate shift, where input distributions change, and prior probability
      shift.
  - source: moreno-torres-2012
    text: >-
      Any situation in which training and test distributions differ. The main
      types are covariate shift (the input distribution changes), prior probability
      shift (the class distribution changes), and concept shift (the relationship
      between inputs and outputs changes).
  - source: nist-ai-rmf
    text: >-
      A risk specific to AI: data used to build a system may not represent the
      context of use, and the conditions of deployment may change, so that performance
      and trustworthiness degrade after deployment.
  note: >-
    Distribution shift is the umbrella term. Concept drift, a change in the input–output
    relationship over time, is one kind of shift and has its own entry.
  related:
  - concept-drift
  - generalization
  - robustness
  - reliability
- key: embedding
  term: Embedding
  definitions:
  - source: bengio-2003
    text: >-
      A learned, distributed feature vector that represents a discrete symbol,
      such as a word, in a continuous space, so that similar symbols have similar
      vectors.
  - source: mikolov-2013
    text: >-
      A continuous vector representation of words, learned from large corpora,
      in which semantic and syntactic regularities appear as vector offsets.
  - source: goodfellow-2016
    at: ch. 15
    text: >-
      Any learned representation that maps inputs to points in a vector space
      where distances reflect a notion of similarity useful for a task.
  related:
  - deep-learning
  - retrieval-augmented-generation
- key: featurization
  term: Featurization
  alias: input regularization, feature engineering
  definitions:
  - source: stracuzzi-2017
    at: pp. 14–15
    text: >-
      Preprocessing observations before a model is induced from them, such as
      applying a low-pass filter to seismic waveforms. Its *regularization effects*
      are a source of uncertainty in the ML pipeline: preprocessing that removes
      irrelevant signals may also alter the information of interest.
  - source: darling-2019
    at: p. 11
    text: >-
      Termed *input regularization*: the step that processes the indirect observations
      before statistical model induction (Fig. 2.5b). How the data is processed
      can lead to biases, which may or may not be desirable, and its *regularization
      effects* are one source of solution uncertainty.
  - source: zheng-casari-2018
    text: >-
      *Feature engineering*: extracting features from raw data and transforming
      them into formats suitable for a machine learning model.
  note: >-
    Stracuzzi et al. (2017) call this step *regularization*, and Darling (2019)
    calls it *input regularization*. This dictionary uses featurization to avoid
    confusion with regularization in the sense of penalty terms or priors, which
    constrain model fitting and belong to model induction.
  related:
  - measurement-error
  - model-form-uncertainty
  - uncertainty-quantification
  - regularization
- key: fine-tuning
  term: Fine-Tuning
  definitions:
  - source: howard-ruder-2018
    text: >-
      Adapting a model pre-trained on a large general corpus to a target task
      by continuing to train some or all of its parameters on task-specific data.
  - source: bommasani-2021
    text: >-
      One form of *adaptation*, in which a foundation model's parameters are updated
      on downstream data. It contrasts with prompting, which leaves parameters
      unchanged.
  - source: iso-22989
    text: >-
      Additional training of a pre-trained model on a smaller, task- or domain-specific
      dataset.
  related:
  - transfer-learning
  - foundation-model
  - rlhf
- key: generalization
  term: Generalization
  definitions:
  - source: goodfellow-2016
    at: §5.2
    text: >-
      The ability of a model to perform well on previously unobserved inputs,
      not only on the inputs it was trained on.
  - source: hastie-2009
    at: ch. 7
    text: >-
      Measured by the *generalisation* (test) error: the expected prediction error
      of a model on an independent sample from the same distribution as the training
      data.
  - source: iso-22989
    text: >-
      The ability of a machine learning model to make predictions that are as
      accurate on new data as on training data.
  note: >-
    Classical generalisation assumes that test data come from the same distribution
    as training data. Generalisation under distribution shift is a harder, separate
    problem.
  related:
  - overfitting
  - distribution-shift
  - training-data
  - validation-data
  - test-data
- key: gradient-descent
  term: Gradient Descent
  definitions:
  - source: goodfellow-2016
    at: §4.3
    text: >-
      An optimisation method that decreases a function by repeatedly moving its
      parameters a small step in the direction of the negative gradient.
  - source: bishop-2006
    at: §5.2.4
    text: >-
      An iterative method for training models in which each update moves the weights
      in the direction of steepest decrease of the error function. *Stochastic*
      or *online* gradient descent updates on one data point, or a small batch,
      at a time.
  related:
  - loss-function
  - neural-network
- key: hyperparameter
  term: Hyperparameter
  definitions:
  - source: goodfellow-2016
    at: §5.3
    text: >-
      A setting that controls a learning algorithm's behaviour and is not adapted
      by the algorithm itself, such as model capacity or learning rate. Hyperparameters
      are usually chosen with a validation set.
  - source: iso-22989
    text: >-
      A characteristic of a machine learning algorithm that affects its learning
      process. It is selected before training rather than learned from the training
      data.
  - source: bishop-2006
    text: >-
      A parameter of a prior distribution or of the model family, rather than
      a parameter fitted directly to the data. Examples are regularisation coefficients
      and the number of basis functions.
  related:
  - training-data
  - validation-data
  - test-data
  - model
- key: inference-error
  term: Inference Error
  definitions:
  - source: stracuzzi-2017
    at: p. 14
    text: >-
      Error introduced when inference procedures map examples through the learned
      model into output values. Depending on the model, inference may only be
      approximate.
  - source: darling-2019
    at: pp. 11–12
    text: >-
      Uncertainty from the approximate inference step that maps the induced model
      to the unobservable inferred state (Fig. 2.5d). Some models require sampling
      to make inferences.
  - source: blei-2017
    text: >-
      In Bayesian models, the error introduced by approximating an intractable
      posterior, for example with variational inference or Markov chain Monte
      Carlo. Variational inference in particular tends to underestimate the variance
      of the posterior.
  related:
  - uncertainty-quantification
  - model-form-uncertainty
  - solution-uncertainty
- key: loss-function
  term: Loss Function
  alias: cost function, objective
  definitions:
  - source: goodfellow-2016
    at: §4.3
    text: >-
      The function to be minimised during training, also called the cost, error,
      or objective function. It measures how far a model's outputs are from the
      targets.
  - source: hastie-2009
    at: §2.4
    text: >-
      A function $L(Y, f(X))$ that penalises errors in prediction. Examples are
      squared-error loss for regression and 0–1 loss for classification.
  - source: sutton-barto-2018
    text: >-
      In reinforcement learning, the role of the loss is played by a *reward signal*
      to be maximised rather than an error to be minimised.
  related:
  - gradient-descent
  - alignment
- key: machine-learning
  term: Machine Learning
  alias: ML
  definitions:
  - source: mitchell-1997
    quote: true
    text: >-
      A computer program is said to learn from experience $E$ with respect to
      some class of tasks $T$ and performance measure $P$, if its performance
      at tasks in $T$, as measured by $P$, improves with experience $E$.
  - source: samuel-1959
    text: >-
      The field of study that gives computers the ability to learn without being
      explicitly programmed. This wording is widely attributed to Samuel but does
      not appear verbatim in the paper.
  - source: iso-22989
    text: >-
      The process of optimising model parameters through computational techniques
      so that the model's behaviour reflects the data or experience.
  - source: goodfellow-2016
    at: ch. 1
    text: >-
      The ability of AI systems to acquire their own knowledge by extracting patterns
      from raw data.
  note: >-
    Mitchell's definition is operational and testable. ISO/IEC 22989 describes
    the mechanism, parameter optimisation, and is the one most often used in governance
    documents.
  related:
  - artificial-intelligence
  - supervised-learning
  - unsupervised-learning
  - reinforcement-learning
- key: measurement-error
  term: Measurement Error
  definitions:
  - source: stracuzzi-2017
    at: pp. 14–15
    text: >-
      The first source of uncertainty in the ML pipeline: error in the observations
      themselves. For a seismograph, it arises from calibration, from vibrations
      with non-seismic sources such as wind, and from limited sensor sensitivity.
  - source: darling-2019
    at: p. 11
    text: >-
      Uncertainty introduced by data collection, together with questions of data
      sufficiency: which data, and how much, should be collected, and how long
      before it must be recollected.
  - source: jcgm-100
    at: §B.2.19
    text: >-
      The result of a measurement minus the true value of the quantity being measured.
      Because the true value cannot be known exactly, the error cannot be known
      exactly either.
  - source: jcgm-100
    at: §2.2.3
    text: >-
      Distinguished from *measurement uncertainty*: a parameter, associated with
      the result of a measurement, that characterises the dispersion of the values
      that could reasonably be attributed to the quantity being measured.
  note: >-
    Metrology separates the error of a single result, which is unknowable, from
    the uncertainty that characterises the plausible range of values. In machine
    learning, measurement error affects both the training data and the inputs
    at prediction time.
  related:
  - uncertainty-quantification
  - featurization
  - solution-uncertainty
  - training-data
- key: minimum-prediction-deviation
  term: Minimum Prediction Deviation
  alias: MPD
  definitions:
  - source: darling-2019
    at: §3.1.2, pp. 27–28
    text: >-
      A covariate-dependent measure of uncertainty for a two-class classifier’s
      prediction at an input $x$. Let $q(x)$ be the estimated probability that
      $x$ belongs to the first class, with its distribution obtained from classifiers
      trained on resampled data, for example by bootstrap sampling. MPD is $U_q(x)
      = \min[u_0(x), u_1(x)]$, where $u_0(x) = \sqrt{E[q(x)^2]}$ and $u_1(x) =
      \sqrt{E[(q(x)-1)^2]}$ measure how far $q(x)$ deviates from 0 and from 1.
      It ranges from 0, when all probability mass is at 0 or 1, to $1/\sqrt{2}
      \approx 0.707$, when half the mass is at 0 and half at 1.
  - source: darling-2019
    at: §3.1, pp. 24, 28
    text: >-
      A measure that quantifies two notions of uncertainty at once: *intrinsic*
      uncertainty, “the uncertainty of classification even when the probabilistic
      structure is completely known”, and *empirical* uncertainty, “the uncertainty
      of estimated outcomes produced by a learned classifier”.
  - source: darling-2019
    at: §3.1.3, p. 29
    text: >-
      A density-weighted variant covers a third notion, the significance of uncertainty
      relative to the density of the data. MPD is multiplied by the probability
      mass $P(B(x, D))$ of the data within a ball of radius $D$ around $x$, to
      place less emphasis on low-density regions, or by its complement, to place
      more emphasis on them, as in anomaly detection.
  note: >-
    MPD was introduced by Darling (2019), so all three definitions come from that
    source. Unlike the standard deviation or a confidence interval, it measures
    the deviation of the probability estimates from the class extremes rather
    than from their mean. It therefore separates distributions with the same mean
    that are tightly clustered, bimodal, or spread out. For a consistent learning
    method, MPD converges to the intrinsic uncertainty $\min(p_1, 1-p_1)$ as the
    training sample grows. Its intended use is post-learning decision making:
    accepting a prediction when its uncertainty is within an application-specific
    tolerance, and otherwise sending it for further analysis or human review.
  related:
  - uncertainty-quantification
  - solution-uncertainty
  - model-form-uncertainty
  - reliability
- key: model
  term: Model
  alias: ML model
  definitions:
  - source: iso-22989
    text: >-
      A mathematical construct that generates an inference or prediction from
      input data. A *machine learning model* is a model produced by training on
      data.
  - source: eu-ai-act
    at: Recital 97
    text: >-
      Distinguished from an *AI system*: a model is a component that needs further
      elements, such as a user interface, to become a system.
  - source: bishop-2006
    at: ch. 1
    text: >-
      A parametric function, or a probability distribution, whose parameters are
      fitted to data so that it can predict target values for new inputs.
  related:
  - ai-system
  - hyperparameter
  - model-card
- key: model-form-uncertainty
  term: Model-Form Uncertainty
  alias: model inadequacy
  definitions:
  - source: stracuzzi-2017
    at: p. 15
    quote: true
    text: >-
      Model-form uncertainty arises from the learning process: many plausible
      model parameterizations exist and each provides a slightly different output.
  - source: darling-2019
    at: p. 11
    quote: true
    text: >-
      The choice of learning algorithm and the parameterization of the subsequent
      model is a source of variability.
  - source: kennedy-ohagan-2001
    text: >-
      Termed *model inadequacy*: the difference between the true process and a
      computer model’s output even at the best-fitting parameter values, represented
      as a model discrepancy term during calibration.
  - source: roy-oberkampf-2011
    text: >-
      Uncertainty due to the assumptions and approximations made in formulating
      a model. It is estimated by comparing model predictions with experimental
      data during validation, and extrapolated to conditions where no data exist.
  note: >-
    In physics-based modelling, model-form uncertainty comes from simplifications
    of the governing equations. In machine learning it comes from the learning
    process itself: model induction is ill-posed, so different samples of the
    training data, or different classes of model, give different but equally plausible
    models. In the pipeline figure of Darling (2019), two inputs feed statistical
    model induction: the *model structure*, such as the learning algorithm and
    its form, and the *model fit criteria*, such as the loss and any regularization
    penalty.
  related:
  - uncertainty-quantification
  - featurization
  - inference-error
  - solution-uncertainty
  - model
- key: neural-network
  term: Neural Network
  alias: artificial neural network
  definitions:
  - source: iso-22989
    text: >-
      A network of one or more layers of neurons, connected by weighted links
      with adjustable weights, that takes input data and produces an output.
  - source: goodfellow-2016
    at: ch. 6
    text: >-
      A *feedforward network* defines a mapping $y = f(x; \theta)$ as a composition
      of many simpler functions, or layers, and learns the parameters $\theta$
      that give the best function approximation.
  - source: bishop-2006
    at: ch. 5
    text: >-
      A flexible class of parametric non-linear functions made of successive linear
      combinations and non-linear activation functions, with parameters fitted
      by optimisation.
  related:
  - deep-learning
  - transformer
  - gradient-descent
- key: overfitting
  term: Overfitting
  definitions:
  - source: goodfellow-2016
    at: §5.2
    text: >-
      Occurs when the gap between the training error and the test error is too
      large, because the model has memorised properties of the training set that
      do not hold for new data.
  - source: iso-22989
    text: >-
      Creating a model that fits the training data too precisely and therefore
      fails to generalise to new data.
  - source: bishop-2006
    at: §1.1
    text: >-
      The phenomenon in which an overly flexible model fits noise in the training
      data, giving small training error but poor predictions on new inputs.
  related:
  - generalization
  - training-data
  - validation-data
  - test-data
- key: regularization
  term: Regularization
  definitions:
  - source: goodfellow-2016
    at: ch. 7
    quote: true
    text: >-
      Any modification we make to a learning algorithm that is intended to reduce
      its generalization error but not its training error.
  - source: bishop-2006
    at: §1.1
    text: >-
      Adding a penalty term to the error function to discourage the coefficients
      from reaching large values, controlling over-fitting. Examples are weight
      decay and, in Bayesian terms, a prior over the parameters.
  related:
  - overfitting
  - generalization
  - featurization
  - model-form-uncertainty
  note: >-
    Not to be confused with *input regularization*, the featurization step of
    the ML pipeline in uncertainty quantification. Regularization in the sense
    used here, penalty terms or priors that constrain how a model is fitted, is
    part of model induction, as one of the model fit criteria in Darling’s (2019)
    pipeline, where it contributes to model-form uncertainty.
- key: reinforcement-learning
  term: Reinforcement Learning
  alias: RL
  definitions:
  - source: sutton-barto-2018
    quote: true
    text: >-
      Reinforcement learning is learning what to do—how to map situations to actions—so
      as to maximize a numerical reward signal.
  - source: iso-22989
    text: >-
      Learning an optimal sequence of actions to maximise a cumulative reward,
      through trial-and-error interaction with an environment.
  - source: russell-norvig-2021
    text: >-
      Learning in which an agent learns from a series of reinforcements, rewards
      and punishments, how to act so as to maximise expected utility.
  related:
  - rlhf
  - agent
  - machine-learning
- key: rlhf
  term: Reinforcement Learning from Human Feedback
  alias: RLHF
  definitions:
  - source: christiano-2017
    text: >-
      Learning a reward function from human judgements comparing pairs of agent
      behaviours, and optimising a policy against that learned reward, where writing
      a reward by hand is impractical.
  - source: ouyang-2022
    text: >-
      A procedure for aligning language models with user intent. A pre-trained
      model is fine-tuned on demonstrations, a reward model is trained on human
      rankings of outputs, and the model is then optimised against the reward
      model with reinforcement learning.
  - source: ji-2023-alignment
    text: >-
      A family of *learning from feedback* techniques used for forward alignment,
      in which human preference signals steer model behaviour toward intended
      values.
  related:
  - alignment
  - fine-tuning
  - reinforcement-learning
- key: self-supervised-learning
  term: Self-Supervised Learning
  alias: SSL
  definitions:
  - source: liu-2021-ssl
    text: >-
      Learning in which supervisory signals are derived automatically from the
      data itself, for example by predicting masked or future parts of the input.
      It needs no human-annotated labels.
  - source: bommasani-2021
    text: >-
      The training method behind foundation models. A model is trained on unlabelled
      data with an objective derived from the data, such as predicting the next
      word.
  - source: iso-22989
    text: >-
      Machine learning that uses unlabelled data and automatically generated labels.
      It is sometimes treated as a subset of unsupervised learning.
  related:
  - foundation-model
  - unsupervised-learning
- key: solution-uncertainty
  term: Solution Uncertainty
  alias: predictive uncertainty
  definitions:
  - source: stracuzzi-2017
    at: p. 14, Fig. 2.2
    text: >-
      The uncertainty in a model’s prediction for an unobservable state. It combines
      the uncertainties from every step of the ML pipeline: measurement errors,
      regularization effects, model-form uncertainty, and inference errors.
  - source: darling-2019
    at: p. 11, Fig. 2.5
    quote: true
    text: >-
      The solution uncertainty is the union of uncertainties associated with measurements,
      regularization, model-form, and inference.
  - source: hullermeier-2021
    text: >-
      The *total* uncertainty of a prediction, made up of aleatoric uncertainty,
      from randomness in the data, and epistemic uncertainty, from the model’s
      lack of knowledge.
  - source: nasem-2012
    text: >-
      The overall uncertainty in a computed quantity of interest, to which UQ
      attributes the contributions of the individual sources of uncertainty.
  note: >-
    Darling (2019) adds a fifth consideration at the end of the pipeline, interpretation
    and decision making: “The model’s interface is also a source of uncertainty:
    the presentation of the outcome can influence a user’s perception of its meaning
    or validity” (p. 12). Stracuzzi et al. argue that the full distribution over
    possible outputs matters, not just a confidence interval, because two distributions
    with the same variance can have very different shapes, for example one bimodal
    and one unimodal.
  related:
  - uncertainty-quantification
  - measurement-error
  - featurization
  - model-form-uncertainty
  - inference-error
- key: supervised-learning
  term: Supervised Learning
  definitions:
  - source: iso-22989
    text: Machine learning that uses only labelled data during training.
  - source: hastie-2009
    at: ch. 2
    text: >-
      Learning to predict an outcome from inputs using a training set of observed
      input–outcome pairs, where the outcome acts as a “teacher” guiding learning.
  - source: goodfellow-2016
    at: §5.1.3
    text: >-
      Learning from a dataset in which each example is associated with a label
      or target, typically in order to estimate $p(y \mid x)$.
  related:
  - unsupervised-learning
  - self-supervised-learning
  - training-data
  - validation-data
  - test-data
- key: test-data
  term: Test Data
  alias: testing data
  definitions:
  - source: eu-ai-act
    at: Art. 3(32)
    text: >-
      Data used for providing an independent evaluation of the AI system, to confirm
      its expected performance before it is placed on the market or put into service.
  - source: hastie-2009
    at: §7.2
    text: >-
      A set used only to assess the generalisation error of the finally chosen
      model. It should be kept “in a vault” and used only at the end of the analysis.
  - source: goodfellow-2016
    at: §5.3
    text: >-
      Examples used to estimate generalisation error. They must not be used to
      make any choices about the model, including its hyperparameters.
  related:
  - training-data
  - validation-data
  - generalization
- key: training-data
  term: Training Data
  definitions:
  - source: iso-22989
    text: Data samples used to train a machine learning model.
  - source: eu-ai-act
    at: Art. 3(29)
    text: >-
      Data used for training an AI system through fitting its learnable parameters.
  - source: hastie-2009
    at: §7.2
    text: >-
      The part of the data used to fit the models, as distinct from the validation
      and test sets.
  related:
  - validation-data
  - test-data
  - overfitting
- key: transfer-learning
  term: Transfer Learning
  definitions:
  - source: pan-yang-2010
    text: >-
      Improving learning of a target task in a target domain by using knowledge
      from a different source domain or task, particularly when target data are
      scarce.
  - source: goodfellow-2016
    at: §15.2
    text: >-
      Using what has been learned in one setting, such as one distribution or
      task, to improve generalisation in another setting.
  - source: bommasani-2021
    text: >-
      The mechanism that makes foundation models possible: knowledge learned during
      pre-training on a surrogate task is transferred to downstream tasks through
      adaptation.
  related:
  - fine-tuning
  - foundation-model
- key: transformer
  term: Transformer
  definitions:
  - source: vaswani-2017
    quote: true
    text: >-
      A new simple network architecture, the Transformer, based solely on attention
      mechanisms, dispensing with recurrence and convolutions entirely.
  - source: zhao-2023
    text: >-
      The standard backbone of large language models. It uses stacked multi-head
      self-attention and feed-forward layers, and its parallelism allows training
      on very large corpora.
  - source: bommasani-2021
    text: >-
      An architecture whose scalability and ability to handle multiple modalities
      made it the dominant basis of foundation models.
  related:
  - large-language-model
  - neural-network
  - deep-learning
- key: uncertainty-quantification
  term: Uncertainty Quantification
  alias: UQ
  definitions:
  - source: stracuzzi-2017
    at: p. 11
    quote: true
    text: >-
      If machine learning establishes relationships between observable and unobservable
      variables, then uncertainty quantification characterizes the variability
      in those relationships.
  - source: darling-2019
    at: p. 3
    text: >-
      Characterising the uncertainty in a supervised model’s predictions, for
      each individual input, in order to quantify the degree to which the end
      user can have confidence in those predictions.
  - source: nasem-2012
    text: >-
      The process of quantifying uncertainties in a computed quantity of interest,
      with the goals of accounting for all sources of uncertainty and quantifying
      how much specific sources contribute to the overall uncertainty. It is one
      of three pillars of model credibility, with verification and validation.
  - source: sullivan-2015
    text: >-
      In computational science, the study of two kinds of problem. *Forward* problems
      propagate uncertainty in a model’s inputs and parameters through the model
      to its outputs. *Inverse* problems infer uncertain parameters, or the model
      itself, from observed data, typically in a Bayesian framework.
  - source: abdar-2021
    text: >-
      Methods that estimate how much confidence to place in a machine learning
      model’s predictions, such as Bayesian neural networks, Monte Carlo dropout,
      and deep ensembles, so that uncertainty can be accounted for in optimisation
      and decision-making.
  - source: hullermeier-2021
    text: >-
      Estimating and separating two kinds of predictive uncertainty. *Aleatoric*
      uncertainty comes from inherent randomness in the data and cannot be reduced.
      *Epistemic* uncertainty comes from the model’s lack of knowledge and can
      in principle be reduced with more data.
  note: >-
    For machine learning, UQ is an *inverse* UQ problem. In science and engineering,
    inverse UQ usually starts from a model built from theoretical equations, such
    as a simulation governed by partial differential equations, and calibrates
    its uncertain parameters against observations. Machine learning follows the
    same steps, but the model is a statistical model induced from data, which
    makes model-form uncertainty central (Stracuzzi et al. 2017). Uncertainty
    enters at each step of the ML pipeline: measurement error in the observations,
    regularization effects from featurization of the inputs, model-form uncertainty
    from learning, and inference error when the model produces outputs. Together
    these make up the solution uncertainty of the inferred state, which people
    then interpret to make decisions. Uncertainty is also distinct from probability
    and error: “Given a fixed model, probability measures the likelihood or belief
    in an inferred outcome, uncertainty characterizes the variability in outcomes,
    and error describes differences between predicted outcomes and actual observations”
    (Darling 2019, p. 12). And it is distinct from accuracy-based performance
    metrics such as ROC curves, which do not capture the variability in a model’s
    output.
  related:
  - measurement-error
  - featurization
  - model-form-uncertainty
  - inference-error
  - solution-uncertainty
  - reliability
  - validity
  - minimum-prediction-deviation
- key: unsupervised-learning
  term: Unsupervised Learning
  definitions:
  - source: iso-22989
    text: Machine learning that uses only unlabelled data during training.
  - source: hastie-2009
    at: ch. 14
    text: >-
      Learning without a “teacher”: inferring properties of the probability density
      of the inputs directly, for example through clustering, density estimation,
      or dimensionality reduction.
  - source: goodfellow-2016
    at: §5.1.3
    text: >-
      Learning useful properties of the structure of a dataset, often the probability
      distribution that generated it, from examples without labels.
  related:
  - supervised-learning
  - self-supervised-learning
- key: validation-data
  term: Validation Data
  definitions:
  - source: eu-ai-act
    at: Art. 3(30)
    text: >-
      Data used for evaluating the trained AI system and for tuning its non-learnable
      parameters and its learning process, among other things to prevent underfitting
      or overfitting.
  - source: hastie-2009
    at: §7.2
    text: >-
      A held-out set used to estimate prediction error for *model selection*:
      choosing between candidate models or model complexities.
  - source: goodfellow-2016
    at: §5.3
    text: >-
      Examples held out from the training data, which the training algorithm does
      not observe, used to set hyperparameters.
  note: >-
    In some fields, especially medicine, “validation” means *external* evaluation
    on new data, which is close to what machine learning calls testing. Check
    which meaning a document uses.
  related:
  - training-data
  - test-data
  - hyperparameter
  - validity
