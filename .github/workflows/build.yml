name: Build dictionary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: twai-dictionary.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: twai-dictionary
          path: twai-dictionary.pdf
